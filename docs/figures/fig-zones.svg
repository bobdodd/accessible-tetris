<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="460" fill="#ffffff"/>
  <!-- 20-row column, 5 zones of 4 rows; row h = 19 -->
  <g transform="translate(140,40)">
    <g stroke="#333" stroke-width="1">
      <!-- zone bands -->
      <rect x="0" y="0"   width="120" height="76" fill="#eaf2fa"/>
      <rect x="0" y="76"  width="120" height="76" fill="#e6f0e6"/>
      <rect x="0" y="152" width="120" height="76" fill="#f5f0df"/>
      <rect x="0" y="228" width="120" height="76" fill="#f2e6da"/>
      <rect x="0" y="304" width="120" height="76" fill="#e8e0ee"/>
      <rect x="0" y="0" width="120" height="380" fill="none" stroke-width="2"/>
      <!-- row lines -->
      <g stroke="#bbb"><path d="M0 19H120M0 38H120M0 57H120M0 95H120M0 114H120M0 133H120M0 171H120M0 190H120M0 209H120M0 247H120M0 266H120M0 285H120M0 323H120M0 342H120M0 361H120"/></g>
      <!-- zone dividers -->
      <g stroke="#333" stroke-width="2"><path d="M0 76H120M0 152H120M0 228H120M0 304H120"/></g>
    </g>
    <g font-size="16" font-weight="bold" fill="#111">
      <text x="140" y="44">Zone 5 — “Sky”  (rows 17–20)</text>
      <text x="140" y="120">Zone 4 — “Upper”  (rows 13–16)</text>
      <text x="140" y="196">Zone 3 — “Middle”  (rows 9–12)</text>
      <text x="140" y="272">Zone 2 — “Lower”  (rows 5–8)</text>
      <text x="140" y="348">Zone 1 — “Ground”  (rows 1–4)</text>
    </g>
    <g font-size="13.5" fill="#444">
      <text x="140" y="64">bright, airy, high overtones</text>
      <text x="140" y="140">clear, present</text>
      <text x="140" y="216">neutral, warm</text>
      <text x="140" y="292">darker, denser</text>
      <text x="140" y="368">deep, heavy, compressed</text>
    </g>
  </g>
  <!-- redundant cues panel -->
  <g transform="translate(560,60)">
    <rect x="0" y="0" width="380" height="330" rx="10" fill="#fbfbfd" stroke="#223" stroke-width="2"/>
    <text x="190" y="36" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Height is a cluster of redundant cues</text>
    <g font-size="15" fill="#222">
      <text x="28" y="84">Spatial elevation</text><text x="220" y="84" fill="#555">coarse zone (1 of ~5)</text>
      <text x="28" y="134">Pitch</text><text x="220" y="134" fill="#555">continuous, precise</text>
      <text x="28" y="184">Brightness (filter)</text><text x="220" y="184" fill="#555">textural, intuitive</text>
      <text x="28" y="234">Tempo / pulse rate</text><text x="220" y="234" fill="#555">urgency</text>
    </g>
    <g stroke="#999" stroke-width="1"><path d="M20 100H360M20 150H360M20 200H360M20 250H360"/></g>
    <text x="190" y="292" font-size="13.5" fill="#555" text-anchor="middle">no single perceptual channel carries</text>
    <text x="190" y="310" font-size="13.5" fill="#555" text-anchor="middle">the vertical dimension alone</text>
  </g>
  <text x="490" y="446" font-size="15" fill="#333" text-anchor="middle">Designing to auditory resolution: 20 game rows collapse to ~5 discriminable elevation zones</text>
</svg>
