<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="490" y="42" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">Braided audio: one play-out channel, serialized and prioritized</text>
  <!-- timeline -->
  <g transform="translate(60,90)">
    <g stroke="#333" stroke-width="1.5" font-size="15" text-anchor="middle">
      <rect x="0"   y="0" width="150" height="56" fill="#d9d2ea"/>
      <rect x="150" y="0" width="110" height="56" fill="#d2e3d2"/>
      <rect x="260" y="0" width="150" height="56" fill="#d9d2ea"/>
      <rect x="410" y="0" width="110" height="56" fill="#e9d9c8"/>
      <rect x="520" y="0" width="150" height="56" fill="#d9d2ea"/>
      <rect x="670" y="0" width="110" height="56" fill="#d2e3d2"/>
      <rect x="780" y="0" width="80" height="56" fill="#d9d2ea"/>
    </g>
    <g font-size="15" fill="#111" text-anchor="middle">
      <text x="75"  y="34">sonar sweep</text>
      <text x="205" y="34">left margin</text>
      <text x="335" y="34">sonar sweep</text>
      <text x="465" y="34">right margin</text>
      <text x="595" y="34">sonar sweep</text>
      <text x="725" y="34">left margin</text>
      <text x="820" y="34">sonar…</text>
    </g>
    <!-- time arrow -->
    <g stroke="#333" stroke-width="2">
      <path d="M0 90 L860 90"/>
      <path d="M860 90 l-12 -6 M860 90 l-12 6"/>
    </g>
    <text x="430" y="118" font-size="14" fill="#555" text-anchor="middle">time →</text>
  </g>
  <g font-size="14.5" fill="#333">
    <text x="60" y="242">Playing every stream at once is discord; interleaving serializes them onto one musical channel,</text>
    <text x="60" y="264">and the interleave ratio expresses priority — here the tessellation sonar runs at twice the rate of the margins.</text>
  </g>
</svg>
