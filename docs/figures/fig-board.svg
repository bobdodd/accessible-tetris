<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="640" fill="#ffffff"/>
  <!-- ===== playfield: 10 x 20, cell 24px, origin (300,60) ===== -->
  <g>
    <rect x="298" y="58" width="244" height="484" fill="#f8f8f8" stroke="#222" stroke-width="2"/>
    <!-- grid lines -->
    <g stroke="#ddd" stroke-width="1">
      <path d="M324 58V542M348 58V542M372 58V542M396 58V542M420 58V542M444 58V542M468 58V542M492 58V542M516 58V542"/>
      <path d="M300 82H540M300 106H540M300 130H540M300 154H540M300 178H540M300 202H540M300 226H540M300 250H540M300 274H540M300 298H540M300 322H540M300 346H540M300 370H540M300 394H540M300 418H540M300 442H540M300 466H540M300 490H540M300 514H540"/>
    </g>
  </g>
  <!-- ===== silhouette (locked tiles), greys with strong outlines ===== -->
  <g stroke="#333" stroke-width="1.5">
    <!-- ragged stack across bottom rows -->
    <g fill="#b9c4d0">
      <rect x="300" y="518" width="24" height="24"/><rect x="324" y="518" width="24" height="24"/><rect x="348" y="518" width="24" height="24"/><rect x="396" y="518" width="24" height="24"/><rect x="420" y="518" width="24" height="24"/><rect x="444" y="518" width="24" height="24"/><rect x="468" y="518" width="24" height="24"/><rect x="492" y="518" width="24" height="24"/><rect x="516" y="518" width="24" height="24"/>
    </g>
    <g fill="#c8d2a8">
      <rect x="300" y="494" width="24" height="24"/><rect x="324" y="494" width="24" height="24"/><rect x="420" y="494" width="24" height="24"/><rect x="444" y="494" width="24" height="24"/><rect x="516" y="494" width="24" height="24"/>
    </g>
    <g fill="#d9b8b8">
      <rect x="300" y="470" width="24" height="24"/><rect x="444" y="470" width="24" height="24"/><rect x="516" y="470" width="24" height="24"/>
    </g>
    <g fill="#c4b6d6">
      <rect x="300" y="446" width="24" height="24"/><rect x="516" y="446" width="24" height="24"/>
    </g>
  </g>
  <!-- gap annotation -->
  <g>
    <line x1="384" y1="560" x2="384" y2="530" stroke="#a33" stroke-width="2" marker-end="url(#arr)"/>
    <text x="384" y="578" font-size="15" fill="#a33" text-anchor="middle">gap in the silhouette</text>
  </g>
  <!-- ===== falling T piece ===== -->
  <g fill="#7f6fb8" stroke="#2c2450" stroke-width="2">
    <rect x="372" y="178" width="24" height="24"/><rect x="396" y="178" width="24" height="24"/><rect x="420" y="178" width="24" height="24"/><rect x="396" y="202" width="24" height="24"/>
  </g>
  <!-- ===== ghost of T at landing ===== -->
  <g fill="none" stroke="#7f6fb8" stroke-width="2" stroke-dasharray="5 4">
    <rect x="372" y="446" width="24" height="24"/><rect x="396" y="446" width="24" height="24"/><rect x="420" y="446" width="24" height="24"/><rect x="396" y="470" width="24" height="24"/>
  </g>
  <!-- ===== hidden rows note ===== -->
  <rect x="298" y="26" width="244" height="30" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="552" y="46" font-size="14" fill="#555">2 hidden spawn rows</text>
  <!-- ===== NEXT box ===== -->
  <g>
    <rect x="600" y="58" width="120" height="96" fill="#fafafa" stroke="#222" stroke-width="2"/>
    <text x="660" y="80" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">NEXT</text>
    <g fill="#8fbf8f" stroke="#274427" stroke-width="2">
      <rect x="648" y="92" width="22" height="22"/><rect x="670" y="92" width="22" height="22"/>
      <rect x="626" y="114" width="22" height="22"/><rect x="648" y="114" width="22" height="22"/>
    </g>
  </g>
  <!-- ===== HOLD box ===== -->
  <g>
    <rect x="120" y="58" width="120" height="96" fill="#fafafa" stroke="#222" stroke-width="2"/>
    <text x="180" y="80" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">HOLD</text>
    <g fill="#c9a26a" stroke="#4d3a1e" stroke-width="2">
      <rect x="152" y="92" width="22" height="22"/>
      <rect x="152" y="114" width="22" height="22"/><rect x="174" y="114" width="22" height="22"/><rect x="196" y="114" width="22" height="22"/>
    </g>
  </g>
  <!-- ===== score panel ===== -->
  <g font-size="16" fill="#222">
    <rect x="600" y="190" width="150" height="110" fill="#fafafa" stroke="#222" stroke-width="2"/>
    <text x="614" y="218">Score: 1400</text>
    <text x="614" y="244">Lines: 17</text>
    <text x="614" y="270">Level: 2</text>
  </g>
  <!-- ===== labels ===== -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#a33"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#224"/>
    </marker>
  </defs>
  <g font-size="15" fill="#224">
    <line x1="240" y1="196" x2="368" y2="196" stroke="#224" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="128" y="200">falling tile</text>
    <line x1="240" y1="462" x2="368" y2="462" stroke="#224" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="128" y="466">ghost position</text>
    <line x1="640" y1="480" x2="546" y2="480" stroke="#224" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="648" y="484">the silhouette</text>
    <text x="420" y="612" font-size="15" fill="#333" text-anchor="middle">Playing area: 10 columns × 20 visible rows</text>
  </g>
</svg>
